function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function quarterOf(dateStr) {
  const d = new Date(dateStr);
  const q = Math.floor(d.getUTCMonth() / 3) + 1;
  return `${d.getUTCFullYear()}-Q${q}`;
}
function monthOf(dateStr) {
  const d = new Date(dateStr);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
}
// UI-facing month display, matching the DD/MM/YYYY convention used
// elsewhere in the app — shown as "MM/YYYY" since there's no day component.
// Internally we still key everything by "YYYY-MM" (monthOf's format),
// since that's what the fee webhook derives from each deal's date.
function toDisplayMonth(monthKey) {
  const [y, m] = (monthKey || "").split("-");
  if (!y || !m) return "";
  return `${m}/${y}`;
}
function fromDisplayMonth(display) {
  const match = /^(\d{1,2})\/(\d{4})$/.exec((display || "").trim());
  if (!match) return null;
  const m = match[1].padStart(2, "0");
  return `${match[2]}-${m}`;
}
function monthLabel(monthKey) {
  const [y, m] = monthKey.split("-");
  const d = new Date(Date.UTC(Number(y), Number(m) - 1, 1));
  return d.toLocaleString("en-GB", {
    month: "long",
    year: "numeric",
    timeZone: "UTC"
  });
}
function computeWeekRows(week, consultants) {
  const enteredAll = consultants.filter(c => week.rows[c.id] !== undefined);
  const missing = consultants.filter(c => week.rows[c.id] === undefined);
  // Excluded consultants (e.g. a new starter, or someone on leave) are kept
  // out of the ranking/points/penalties entirely — as if they simply
  // didn't compete that week — rather than being scored on a zero.
  const excluded = enteredAll.filter(c => week.rows[c.id].excluded);
  const entered = enteredAll.filter(c => !week.rows[c.id].excluded);
  const isCvsOutWeek = week.metric === METRIC_CVS_OUT;
  const rows = entered.map(c => {
    const entry = week.rows[c.id];
    const cvs = Number(entry.cvs) || 0;
    const interviews = Number(entry.interviews) || 0;
    const metricValue = isCvsOutWeek ? cvs : Number(entry.metricValue) || 0;
    return {
      ...c,
      // Prefer the team stamped onto this row when it was originally
      // logged — so changing someone's team assignment later never
      // rewrites how past weeks scored. Only falls back to the live
      // assignment for old rows saved before this existed.
      team: entry.team || c.team,
      cvs,
      interviews,
      metricValue
    };
  });
  const sorted = [...rows].sort((a, b) => b.metricValue - a.metricValue || b.cvs - a.cvs);
  const withRank = sorted.map((r, i) => {
    const prev = sorted[i - 1];
    const rank = prev && prev.metricValue === r.metricValue && prev.cvs === r.cvs ? prev.__rank : i + 1;
    r.__rank = rank;

  // standingsWeekData effect above), adapted into the same shape
  // computeWeekRows already expects, sorted oldest-first same as
  // sortedWeeks was. Kept deliberately separate from sortedWeeks itself,
  // which "Ask The Table" below still reads from unchanged.
  const liveSortedWeeks = useMemo(() => {
    return allLeagueWeekKeys()
      .filter((wk) => standingsWeekData[wk])
      .map((wk) => weekLiveToLegacyShape(standingsWeekData[wk]));
  }, [standingsWeekData]);
  // Weeks that have actually CONCLUDED — everything liveSortedWeeks has,
  // minus whichever one the backend itself flags as isCurrentWeek. A
  // week still in progress can keep changing right up until Sunday, so
  // its points aren't settled yet — Monthly Team Score and the
  // Quarterly boards should only ever total up genuinely finished
  // weeks. "This week's leaderboard" below deliberately still uses
  // liveSortedWeeks (the full set, current week included) — that panel
  // is meant to show live, in-progress standing, not a settled total.
  const settledSortedWeeks = useMemo(() => {
    return allLeagueWeekKeys()
      .filter((wk) => standingsWeekData[wk] && !standingsWeekData[wk].isCurrentWeek)
      .map((wk) => weekLiveToLegacyShape(standingsWeekData[wk]));
  }, [standingsWeekData]);
  // The single most recently CONCLUDED week specifically — genuinely
  // distinct from latestWeek below (which includes the current,
  // still-open week, for "This week's leaderboard"). "Last week's
  // winners" is meant to show exactly that: last week, not this one —
  // kept as its own weekKey (not just the adapted shape settledSortedWeeks
  // holds) specifically so the panel can link straight into reviewing
  // that same week over on Weekly Incentive.
  const lastCompletedWeekKey = useMemo(() => {
    const keys = allLeagueWeekKeys().filter((wk) => standingsWeekData[wk] && !standingsWeekData[wk].isCurrentWeek);
    return keys[keys.length - 1];
  }, [standingsWeekData]);
  const lastCompletedWeek = lastCompletedWeekKey ? weekLiveToLegacyShape(standingsWeekData[lastCompletedWeekKey]) : null;
  const lastCompletedWeekComputed = lastCompletedWeek ? computeWeekRows(lastCompletedWeek, consultants) : null;
  const lastCompletedWeekRows = lastCompletedWeekComputed?.rows || [];
  // "Last week's winners" — genuinely last week, per lastCompletedWeekRows above.
  const latestWinners = lastCompletedWeekRows.length ? weekTeamWinners(lastCompletedWeekRows) : {};
  const latestWeek = liveSortedWeeks[liveSortedWeeks.length - 1];
  const latestWeekComputed = latestWeek ? computeWeekRows(latestWeek, consultants) : null;
  const latestWeekRows = latestWeekComputed?.rows || [];
  const latestWeekMissing = latestWeekComputed?.missing || [];
  // "This week's leaderboard"'s OWN trophy icons, deliberately separate
  // from latestWinners above — this week's own top scorer per team,
  // computed from latestWeekRows (the current, still-open week), not
  // last week's. Mixing these up was the exact bug just fixed: this
  // table's trophy was quietly using last week's winner to decide who
  // gets the icon this week.
  const thisWeekWinners = latestWeekRows.length ? weekTeamWinners(latestWeekRows) : {};
  const existingWeekForDate = useMemo(() => weeks.find(w => w.date === formDate && w.id !== editingWeekId), [weeks, formDate, editingWeekId]);
  const monthlyTotals = useMemo(() => {
    const byMonth = {};
    settledSortedWeeks.forEach(w => {
      const mk = monthOf(w.date);
      if (!byMonth[mk]) byMonth[mk] = {
        james: 0,
        josh: 0
      };
      const {
        rows
      } = computeWeekRows(w, consultants);
      rows.forEach(r => {
        byMonth[mk][r.team] += r.net;
      });
    });
    return Object.entries(byMonth).sort((a, b) => a[0].localeCompare(b[0]));
  }, [settledSortedWeeks, consultants]);
  const quarterlyBoards = useMemo(() => {
    const byQuarter = {};
    settledSortedWeeks.forEach(w => {
      const qk = quarterOf(w.date);
      if (!byQuarter[qk]) {
        byQuarter[qk] = {};
        consultants.forEach(c => {
          byQuarter[qk][c.id] = {
            ...c,
            net: 0
          };
        });
      }
      const {
        rows
      } = computeWeekRows(w, consultants);
      rows.forEach(r => {
        byQuarter[qk][r.id].net += r.net;
      });
    });
    return Object.entries(byQuarter).sort((a, b) => b[0].localeCompare(a[0])).map(([qk, obj]) => [qk, Object.values(obj).sort((a, b) => b.net - a.net)]);
  }, [settledSortedWeeks, consultants]);
  const currentMonthKey = monthOf(todayStr());
  const currentMonthTotals = monthlyTotals.find(([mk]) => mk === currentMonthKey)?.[1] || {
    james: 0,
    josh: 0
  };

  async function saveWeek() {
    const editMode = !!editingWeekId;
    const targetConsultants = editMode ? consultants : consultants.filter(c => c.team === formTeam);
    const newRowsPart = {};
    targetConsultants.forEach(c => {
      const r = formRows[c.id];
      const hasCvs = r && r.cvs !== undefined && r.cvs !== "";
      const hasMetric = r && r.metricValue !== undefined && r.metricValue !== "";
      const hasInterviews = r && r.interviews !== undefined && r.interviews !== "";
      const hasExcludedFlag = r && r.excluded !== undefined;
      if (hasCvs || hasMetric || hasInterviews || hasExcludedFlag) {
        newRowsPart[c.id] = {
          cvs: Number(r.cvs) || 0,
          metricValue: Number(r.metricValue) || 0,
          interviews: Number(r.interviews) || 0,
          // Onsite/Offers are pulled alongside cvs/interviews now (see
          // pullFromAtlas) but were previously dropped here entirely —
          // stored so the Consultant KPIs page's own live computation sees
          // real numbers for this week, not a silent zero.
          onsite: Number(r.onsite) || 0,
          offers: Number(r.offers) || 0,
          team: c.team,
          excluded: !!r.excluded
        };
      }
    });
    let next;
    if (editMode) {
      if (!formMetric.trim()) return;
      next = weeks.map(w => w.id === editingWeekId ? {
        ...w,
        date: formDate,
        metric: formMetric.trim(),
        threshold: formThreshold === "" ? null : Number(formThreshold),
        rows: {
          ...w.rows,
          ...newRowsPart
        },
        // A director explicitly editing this week is a genuine correction
        // now, not just an automatic snapshot anymore — clear the flag so
        // the KPI page's own live computation treats it as authoritative
        // going forward, instead of skipping it as a stale auto-snapshot.
        autoFinalized: false,
      } : w);
    } else {
      const existing = weeks.find(w => w.date === formDate);
      if (existing) {
        next = weeks.map(w => w.id === existing.id ? {
          ...w,
          rows: {
            ...w.rows,
            ...newRowsPart
          },
          autoFinalized: false,
        } : w);
      } else {
        if (!formMetric.trim()) return;
        const newWeek = {
          id: `${formDate}-${Date.now()}`,
          date: formDate,
          metric: formMetric.trim(),
          threshold: formThreshold === "" ? null : Number(formThreshold),
          rows: newRowsPart
        };
        next = [...weeks, newWeek];
      }
    }
    setWeeks(next);
    await persist(next);
    cancelEdit();
    // Previously jumped to the (now-removed) separate "table" tab — the
    // leaderboard lives right below this same form now, so there's
    // nothing to navigate to; just stay put and let it update in place.
  }
  async function pullFromAtlas() {
    setAtlasPulling(true);
    setAtlasError("");
    try {
      const res = await fetch("/api/league?action=tally");
      if (!res.ok) throw new Error("Request failed");
      const data = await res.json();
      const tally = data.tally || {};
      const effectiveMetric = existingWeekForDate ? existingWeekForDate.metric : formMetric;
      const targetConsultants = editingWeekId ? consultants : consultants.filter(c => c.team === formTeam);
      let matched = 0;
      setFormRows(prev => {
        const next = { ...prev };
        targetConsultants.forEach(c => {
          const t = tally[c.id];
          if (!t) return;
          matched += 1;
          const cvs = t.cvsOut || 0;
          const interviews = t.interviews || 0;
          // Onsite and Offers are pulled here too now, regardless of which
          // metric this week is scored on — they don't feed the League
          // Table's own scoring, but they DO need to be stored on the row
          // so the Consultant KPIs page (which reads this same saved row)
          // shows real numbers instead of silently defaulting to zero.
          const onsite = t.onsite || 0;
          const offers = t.offers || 0;
          if (effectiveMetric === METRIC_CVS_OUT) {
            next[c.id] = { ...next[c.id], cvs: String(cvs), interviews: String(interviews), onsite: String(onsite), offers: String(offers) };
          } else if (effectiveMetric === METRIC_RATIO) {
            const pct = cvs > 0 ? Math.round(interviews / cvs * 100) : 0;
            next[c.id] = { ...next[c.id], cvs: String(cvs), metricValue: String(pct), onsite: String(onsite), offers: String(offers) };
          } else {
            next[c.id] = { ...next[c.id], cvs: String(cvs), metricValue: String(interviews), onsite: String(onsite), offers: String(offers) };
          }
        });
        return next;
      });
      if (matched === 0) setAtlasError("No Atlas activity found yet for this week.");
    } catch (e) {
      setAtlasError("Couldn't reach Atlas data.");
    } finally {
      setAtlasPulling(false);
    }
  }

  async function askQuestion() {
    if (!question.trim()) return;
    if (!apiKey.trim()) {
      setAskError("Add your Anthropic API key above first.");
      return;
    }
    setAsking(true);
    setAskError("");
    setAnswer("");
    try {
      const dataset = sortedWeeks.map(w => {
        const {
          rows
        } = computeWeekRows(w, consultants);
        return {
          date: w.date,
          metric: w.metric,
          threshold: w.threshold,
          results: rows.map(r => ({
            name: r.name,
            team: TEAMS[r.team].label,
            cvsOut: r.cvs,
            metricValue: r.metricValue,
            rank: r.rank,
            weeklyPoints: r.net
          }))
        };
      });
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey.trim(),
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: `You are analysing a recruitment incentive league table for Reload. Two teams: Team James and Team Josh, 10 consultants total. Here is the full season's weekly data as JSON (each week has a rotating metric, CVs Out, and computed weekly points which already include rank points and any penalties):\n\n${JSON.stringify(dataset)}\n\nAnswer this question concisely, referencing specific consultants/numbers where relevant:\n\n${question}`
          }]
        })
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => null);
        throw new Error(errBody?.error?.message || `Request failed (${res.status})`);
      }
      const data = await res.json();
      const text = (data.content || []).map(b => b.text || "").join("\n").trim();
      setAnswer(text || "No answer returned.");
    } catch (e) {
      setAskError(e.message || "Couldn't reach the model. Check your API key and try again.");
    } finally {
      setAsking(false);
    }
  }

  function explorerSortedRows(rows, mode, accessors) {
    const sort = explorerSort[mode];
    if (!sort) return rows;
    const { column, direction } = sort;
    const accessor = accessors[column];
    if (!accessor) return rows;
    const sorted = [...rows].sort((a, b) => {
      const av = accessor(a), bv = accessor(b);
      if (typeof av === "string") return av.localeCompare(bv);
      return (av || 0) - (bv || 0);
    });
    return direction === "desc" ? sorted.reverse() : sorted;
  }
